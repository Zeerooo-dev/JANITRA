name: Build signed Android release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version matching pubspec.yaml, for example v1.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tool/check_source_secrets.py
      - name: Analyze and test
        run: |
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub
      - name: Configure private signing and public client configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tool/android_release.py configure
      - name: Build production APK
        run: >-
          flutter build apk --release --no-pub
          --dart-define-from-file=config/supabase.json
          --dart-define=JANITRA_RELEASE_REPOSITORY=${{ github.repository }}
      - name: Verify APK and package review artifacts
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          (cd android && ./gradlew :app:testDebugUnitTest --console=plain)
          python3 tool/test_android_release.py
          python3 tool/android_release.py package
          git archive --format=zip --prefix=JANITRA/ -o build/release/JANITRA-Source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JANITRA-${{ inputs.release_tag }}-review
          path: build/release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties config/signing/release.jks config/supabase.json

# This workflow builds review artifacts only. Publishing is a separate approved action.
