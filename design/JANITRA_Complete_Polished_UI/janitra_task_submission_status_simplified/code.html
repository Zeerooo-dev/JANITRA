<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="mobile_stack" name="shell-type"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}
</style>
<link rel="stylesheet" href="../assets/tailwind-offline.css">
<style>

    body {
      min-height: max(884px, 100dvh);
    }
  
</style>
<link href="../assets/janitra-polish.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen" data-janitra-screen="janitra_task_submission_status_simplified" style="font-family: 'Roboto', sans-serif; background-color: #F5F6F8; color: #202C39;">
<header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
<div class="h-16 px-4 flex items-center justify-between border-b border-gray-200/60 bg-white">
<div class="flex items-center gap-2">
<button aria-label="Go back" class="min-w-[48px] min-h-[48px] flex items-center justify-center text-[#202C39] hover:text-[#234E70] transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-[26px]">
arrow_back
</span>
</button>
<h1 class="text-[20px] font-semibold text-[#202C39]">
Task Submission Status
</h1>
</div>
</div>
</header>
<main class="flex flex-col relative w-full pt-16 pb-safe px-margin bg-surface flex-1">
<div class="flex flex-col flex-1 max-w-md mx-auto w-full px-5 py-8 justify-between">
<div class="flex flex-col items-center justify-center text-center mt-6">
<div class="w-full bg-white rounded-2xl p-8 shadow-sm flex flex-col items-center text-center">
<div class="w-20 h-20 rounded-full flex items-center justify-center mb-6" style="background-color: #E8F5E9;">
<span class="material-symbols-outlined text-[44px]" style="color: #2E7D32; font-variation-settings: 'FILL' 1;">
check_circle
</span>
</div>
<h2 class="text-[24px] font-bold text-[#202C39] mb-2">
Task Submitted!
</h2>
<p class="text-[20px] font-semibold text-[#202C39] mb-4">
Cleaning Tables
</p>
<div class="inline-flex items-center gap-2 px-4 py-2 rounded-full mb-6" style="background-color: #FEF7E0; color: #B06000;">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">
schedule
</span>
<span class="text-[16px] font-medium">
Pending Approval
</span>
</div>
<p class="text-[17px] text-[#526070] leading-relaxed max-w-[280px]">
Your supervisor will review your work.
</p>
</div>
</div>
<div class="mt-8 pb-4 w-full">
<button class="w-full h-14 rounded-xl flex items-center justify-center text-white text-[18px] font-bold shadow-md transition-opacity active:opacity-90" onclick="window.location.href='../janitra_my_tasks_simplified/code.html'" style="background-color: #234E70;" type="button">
Back to My Tasks
</button>
</div>
</div>
</main>
</body>
</html>
