<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#234E70">
<title>
JANITRA · Add Personnel
</title>
<link rel="stylesheet" href="../assets/janitra-remaining.css">
</head>
<body>
<div class="screen">
<header class="head">
<a class="back" aria-label="Back" href="../janitra_personnel_directory/code.html">
←
</a>
<div class="headcopy">
<h1>
Add Personnel
</h1>
</div>
<div class="avatar" aria-label="Supervisor profile">
SV
</div>
</header>
<main class="">
<form onsubmit="JANITRA.submitForm(event,'Personnel invitation')">
<div class="field-wrap">
<label class="label">
Full Name *
<input class="field" name="full_name" type="text" placeholder="e.g. Juan Dela Cruz" required>
</label>
</div>
<div class="field-wrap">
<label class="label">
Employee ID
<input class="field" name="employee_id" type="text" placeholder="e.g. JDC-2041" >
</label>
</div>
<div class="field-wrap">
<label class="label">
Email Address *
<input class="field" name="email_address" type="email" placeholder="name@example.com" required>
</label>
</div>
<div class="field-wrap">
<label class="label" for="agency">
Manpower Agency
</label>
<select class="field" id="agency" required>
<option>
ABC Manpower Services
</option>
<option>
Apex Facility Solutions
</option>
<option>
Prime Clean Services
</option>
</select>
</div>
<div class="field-wrap">
<label class="label" for="site">
Assigned Site
</label>
<select class="field" id="site" required>
<option>
SSS Valencia
</option>
<option>
SSS Cagayan de Oro
</option>
</select>
</div>
<p class="small muted section">
The employee will receive an account invitation by email.
</p>
<button class="action" type="submit">
Invite Personnel
</button>
</form>
</main>
</div>
<div class="dialog" id="notice-dialog" role="dialog" aria-modal="true">
<div class="dialog-box">
<h2>
JANITRA Preview
</h2>
<p data-msg>
</p>
<button class="action" onclick="JANITRA.close()">
OK
</button>
</div>
</div>
<div class="dialog" id="confirm-dialog" role="dialog" aria-modal="true">
<div class="dialog-box">
<h2 data-title>
Confirm
</h2>
<p data-desc>
</p>
<div class="actions">
<button class="action" data-confirm>
Confirm
</button>
<button class="action secondary" onclick="JANITRA.close()">
Cancel
</button>
</div>
</div>
</div>
<script src="../assets/janitra-remaining.js">
</script>
</body>
</html>
