<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#234E70">
<title>
JANITRA · Edit Work Schedule
</title>
<link rel="stylesheet" href="../assets/janitra-remaining.css">
</head>
<body>
<div class="screen">
<header class="head">
<a class="back" aria-label="Back" href="../janitra_work_schedule_overview/code.html">
←
</a>
<div class="headcopy">
<h1>
Edit Work Schedule
</h1>
</div>
<div class="avatar" aria-label="Supervisor profile">
SV
</div>
</header>
<main class="">
<p class="site">
Juan Dela Cruz · SSS Valencia
</p>
<form onsubmit="event.preventDefault();const v=[...document.querySelectorAll('.day[aria-pressed=true]')];if(!v.length){JANITRA.toast('Choose at least one working day.');return}; JANITRA.preview('Save schedule with selected days and effective date')">
<section class="section">
<h2>
Working Days
</h2>
<div class="days" role="group" aria-label="Working days">
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Mon
</button>
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Tue
</button>
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Wed
</button>
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Thu
</button>
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Fri
</button>
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Sat
</button>
<button type="button" class="day" aria-pressed="false" onclick="JANITRA.toggleDay(this)">
Sun
</button>
</div>
</section>
<section class="section">
<h2>
Working Hours
</h2>
<div id="shifts">
<div class="shift">
<div class="shift-head">
<strong>
Morning Shift
</strong>
</div>
<div class="time-pair">
<label>
<span class="label">
Start
</span>
<input class="field" type="time" value="07:00" required>
</label>
<label>
<span class="label">
End
</span>
<input class="field" type="time" value="12:00" required>
</label>
</div>
</div>
<div class="shift">
<div class="shift-head">
<strong>
Afternoon Shift
</strong>
</div>
<div class="time-pair">
<label>
<span class="label">
Start
</span>
<input class="field" type="time" value="16:00" required>
</label>
<label>
<span class="label">
End
</span>
<input class="field" type="time" value="20:00" required>
</label>
</div>
</div>
</div>
<button class="action secondary condensed" type="button" onclick="JANITRA.addShift()">
+ Add Another Shift
</button>
<template id="shift-template">
<div class="shift">
<div class="shift-head">
<strong>
Additional Shift
</strong>
<button class="text-button" type="button" onclick="this.closest('.shift').remove()">
Remove
</button>
</div>
<div class="time-pair">
<label>
<span class="label">
Start
</span>
<input class="field" type="time" value="08:00" required>
</label>
<label>
<span class="label">
End
</span>
<input class="field" type="time" value="09:00" required>
</label>
</div>
</div>
</template>
</section>
<div class="field-wrap">
<label class="label" for="effective-date">
Effective From
</label>
<input class="field" id="effective-date" type="date" value="2026-10-12" required>
<p class="help">
Previous completed records will not change.
</p>
</div>
<button class="action" type="submit">
Save Schedule
</button>
</form>
</main>
</div>
<div class="dialog" id="notice-dialog" role="dialog" aria-modal="true">
<div class="dialog-box">
<h2>
JANITRA Preview
</h2>
<p data-msg>
</p>
<button class="action" onclick="JANITRA.close()">
OK
</button>
</div>
</div>
<div class="dialog" id="confirm-dialog" role="dialog" aria-modal="true">
<div class="dialog-box">
<h2 data-title>
Confirm
</h2>
<p data-desc>
</p>
<div class="actions">
<button class="action" data-confirm>
Confirm
</button>
<button class="action secondary" onclick="JANITRA.close()">
Cancel
</button>
</div>
</div>
</div>
<script src="../assets/janitra-remaining.js">
</script>
</body>
</html>
