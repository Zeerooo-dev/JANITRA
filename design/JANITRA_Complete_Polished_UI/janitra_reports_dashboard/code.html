<main class="withnav">
<p class="site">
SSS Valencia

<section class="section">
<div class="tabs" role="tablist" aria-label="Report period">
<button type="button" class="tab active" data-value="weekly" onclick="JANITRA.setTab(this)">
Weekly
</button>
<button type="button" class="tab" data-value="monthly" onclick="JANITRA.setTab(this)">
Monthly
</button>
<button type="button" class="tab" data-value="custom" onclick="JANITRA.setTab(this)">
Custom
</button>
</div>

<section class="card section">
<h2>
Report Filters
</h2>
<div class="field-wrap">
<label class="label" for="report-site">
Site
</label>
<select class="field" id="report-site">
<option>
SSS Valencia
</option>
</select>
</div>
<div class="field-wrap" style="margin-bottom:0">
<label class="label" for="report-person">
Personnel
</label>
<select class="field" id="report-person">
<option>
All Personnel
</option>
<option>
Juan Dela Cruz
</option>
<option>
Maria Reyes
</option>
<option>
Elena Bautista
</option>
</select>
</div>
<div id="range-custom" class="hide" style="margin-top:18px">
<div class="time-pair">
<label>
<span class="label">
From
</span>
<input class="field" type="date" value="2026-10-05">
</label>
<label>
<span class="label">
To
</span>
<input class="field" type="date" value="2026-10-10">
</label>
</div>
</div>
</section>
<section class="section">
<h2>
Report Summary
</h2>
<div class="metrics">
<div class="metric">
<span>
Scheduled
</span>
<strong>
48
</strong>
</div>
<div class="metric">
<span>
Approved
</span>
<strong>
38
</strong>
</div>
<div class="metric">
<span>
Pending
</span>
<strong>
6
</strong>
</div>
<div class="metric">
<span>
Rejected / Locked
</span>
<strong>
4
</strong>
</div>
</div>
<p class="help">
Example figures for the design preview.
</p>
</section>
