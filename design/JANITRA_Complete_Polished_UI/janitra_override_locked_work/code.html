<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#234E70">
<title>
JANITRA · Override Locked Work
</title>
<link rel="stylesheet" href="../assets/janitra-remaining.css">
</head>
<body>
<div class="screen">
<header class="head">
<a class="back" aria-label="Back" href="../janitra_locked_work_simplified/code.html">
←
</a>
<div class="headcopy">
<h1>
Override Locked Work
</h1>
</div>
<div class="avatar" aria-label="Supervisor profile">
SV
</div>
</header>
<main class="">
<section class="card section">
<div class="person-name">
Juan Dela Cruz
</div>
<p class="muted small" style="margin:4px 0 10px">
Cleaning Ceiling
</p>
<span class="status danger">
Locked
</span>
<div class="divider">
</div>
<div class="detail-row">
<span class="muted">
Original Deadline
</span>
<strong>
Monday, Oct 12 · 12:00 PM
</strong>
</div>
</section>
<form onsubmit="JANITRA.submitForm(event,'Locked-task override')">
<div class="field-wrap">
<label class="label" for="override-reason">
Reason for Override *
</label>
<textarea class="field" id="override-reason" required placeholder="Explain why this task needs more review time.">
</textarea>
</div>
<div class="field-wrap">
<label class="label" for="new-date">
New Review Deadline *
</label>
<div class="time-pair">
<input class="field" aria-label="New deadline date" id="new-date" type="date" value="2026-10-13" required>
<input class="field" aria-label="New deadline time" type="time" value="17:00" required>
</div>
</div>
<p class="small muted section">
This action will be recorded.
</p>
<div class="actions">
<button class="action" type="submit">
Confirm Override
</button>
<a href="../janitra_locked_work_simplified/code.html" class="action secondary">
Cancel
</a>
</div>
</form>
</main>
</div>
<div class="dialog" id="notice-dialog" role="dialog" aria-modal="true">
<div class="dialog-box">
<h2>
JANITRA Preview
</h2>
<p data-msg>
</p>
<button class="action" onclick="JANITRA.close()">
OK
</button>
</div>
</div>
<div class="dialog" id="confirm-dialog" role="dialog" aria-modal="true">
<div class="dialog-box">
<h2 data-title>
Confirm
</h2>
<p data-desc>
</p>
<div class="actions">
<button class="action" data-confirm>
Confirm
</button>
<button class="action secondary" onclick="JANITRA.close()">
Cancel
</button>
</div>
</div>
</div>
<script src="../assets/janitra-remaining.js">
</script>
</body>
</html>
