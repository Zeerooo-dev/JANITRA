<!DOCTYPE html>
<html lang="en" style="width: 390px; height: 1002px; overflow: hidden; position: relative;">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="mobile_stack" name="shell-type"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/tailwind-offline.css">
<style>
@layer base{html,body{width:100%;margin:0;padding:0;background-color:#f8f9ff;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}
</style>
<link href="../assets/janitra-polish.css" rel="stylesheet"/>
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen" data-janitra-screen="janitra_confirm_task_with_pin">
<header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
<div class="h-16 px-margin flex items-center justify-between gap-space-sm">
<div class="flex items-center gap-space-xs min-w-0">
<button aria-label="Go back" class="w-14 h-14 min-w-[56px] min-h-[56px] -ml-2 flex items-center justify-center rounded-lg text-on-surface hover:bg-surface-variant transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-[28px]">
arrow_back
</span>
</button>
<h1 class="font-title-md text-title-md text-on-surface truncate tracking-tight">
Confirm Task PIN
</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[18px]">
person
</span>
</div>
</div>
</div>
</header>
<main class="flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface flex-1">
<div class="flex flex-col w-full pb-space-xl">
<!-- Task Context & Instruction Card -->
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm mb-space-md">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">

      Cleaning Tables
    
</h2>
<div class="flex items-center gap-space-xs text-secondary font-body-md text-body-md mb-space-sm">
<span class="material-symbols-outlined text-[20px] text-primary">
schedule
</span>
<span class="">
10:00 AM
</span>
<span class="">
•
</span>
<span class="material-symbols-outlined text-[20px] text-primary">
location_on
</span>
<span class="truncate">
Public Service Area
</span>
</div>
<div class="bg-surface-container-low rounded-lg p-space-sm flex items-start gap-space-xs">
<span class="material-symbols-outlined text-primary text-[22px] shrink-0 mt-0.5">
key
</span>
<p class="font-body-md text-body-md text-on-surface">
Enter your 4-digit PIN to submit this task.
</p>
</div>
</div>
<!-- PIN Entry Display -->
<div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm mb-space-md flex flex-col items-center">
<div class="text-secondary font-label-lg text-label-lg uppercase tracking-wider mb-space-md">
Your 4-Digit PIN
</div>
<!-- 4 PIN Wells with Large Tactile States -->
<div aria-live="polite" class="flex items-center justify-center gap-space-md w-full max-w-[280px] mb-space-sm" id="pin-slots">
<!-- Slot 1 (Filled) -->
<div class="w-14 h-16 rounded-xl bg-surface-container flex items-center justify-center transition-all duration-150" id="slot-0">
<div class="w-5 h-5 rounded-full bg-primary-container transform scale-100 transition-transform">
</div>
</div>
<!-- Slot 2 (Filled) -->
<div class="w-14 h-16 rounded-xl bg-surface-container flex items-center justify-center transition-all duration-150" id="slot-1">
<div class="w-5 h-5 rounded-full bg-primary-container transform scale-100 transition-transform">
</div>
</div>
<!-- Slot 3 (Filled) -->
<div class="w-14 h-16 rounded-xl bg-surface-container flex items-center justify-center transition-all duration-150" id="slot-2">
<div class="w-5 h-5 rounded-full bg-primary-container transform scale-100 transition-transform">
</div>
</div>
<!-- Slot 4 (Active/Empty) -->
<div class="w-14 h-16 rounded-xl bg-surface-container-high flex items-center justify-center transition-all duration-150" id="slot-3">
<div class="w-1 h-7 rounded-full bg-primary animate-pulse" id="cursor-indicator">
</div>
</div>
</div>
<!-- Live Subtitle status feedback -->
<p class="font-label-md text-label-md text-primary font-semibold flex items-center gap-1" id="pin-status-text">
Enter your 4-digit PIN
</p>
</div>
<!-- High-Accessibility 3x4 Numeric Keypad -->
<div class="w-full mb-space-md">
<div class="grid grid-cols-3 gap-space-xs">
<!-- Digit 1 -->
<button class="h-14 min-h-[56px] rounded-xl bg-surface-container-lowest active:bg-secondary-container text-on-surface font-headline-md text-headline-md shadow-sm flex items-center justify-center select-none active:scale-95 transition-transform" onclick="handleKey('1')" type="button">

        1
      
</button>
<!-- Digit 2 -->
<button class="h-14 min-h-[56px] rounded-xl bg-surface-container-lowest active:bg-secondary-container text-on-surface font-headline-md text-headline-md shadow-sm flex items-center justify-center select-none active:scale-95 transition-transform" onclick="handleKey('2')" type="button">

        2
      
</button>
<!-- Digit 3 -->
<button class="h-14 min-h-[56px] rounded-xl bg-surface-container-lowest active:bg-secondary-container text-on-surface font-headline-md text-headline-md shadow-sm flex items-center justify-center select-none active:scale-95 transition-transform" onclick="handleKey('3')" type="button">

        3
      
</button>
<!-- Digit 4 -->
<button class="h-14 min-h-[56px] rounded-xl bg-surface-container-lowest active:bg-secondary-container text-on-surface font-headline-md text-headline-md shadow-sm flex items-center justify-center select-none active:scale-95 transition-transform" onclick="handleKey('4')" type="button">

        4
      
</button>
<!-- Digit 5 -->
<button class="h-14 min-h-[56px] rounded-xl bg-surface-container-lowest active:bg-secondary-container text-on-surface font-headline-md text-headline-md shadow-sm flex items-center justify-center select-none active:scale-95 transition-transform" onclick="handleKey('5')" type="button">

        5
      
</button>
<!-- Digit 6 -->
<button class="h-14 min-h-[56px] rounded-xl bg-surface-container-lowest active:bg-secondary-container text-on-surface font-headline-md text-headline-md shadow-sm flex items-center justify-center select-none active:scale-95 transition-transform" onclick="handleKey('6')" type="button">

        6
      
</button>
<!-- Digit 7 -->
<button class="h-14 min-h-[56px] rounded-xl bg-surface-container-lowest active:bg-secondary-container text-on-surface font-headline-md text-headline-md shadow-sm flex items-center justify-center select-none active:scale-95 transition-transform" onclick="handleKey('7')" type="button">

        7
      
</button>
<!-- Digit 8 -->
<button class="h-14 min-h-[56px] rounded-xl bg-surface-container-lowest active:bg-secondary-container text-on-surface font-headline-md text-headline-md shadow-sm flex items-center justify-center select-none active:scale-95 transition-transform" onclick="handleKey('8')" type="button">

        8
      
</button>
<!-- Digit 9 -->
<button class="h-14 min-h-[56px] rounded-xl bg-surface-container-lowest active:bg-secondary-container text-on-surface font-headline-md text-headline-md shadow-sm flex items-center justify-center select-none active:scale-95 transition-transform" onclick="handleKey('9')" type="button">

        9
      
</button>
<!-- Clear Action -->
<button class="h-14 min-h-[56px] rounded-xl bg-surface-container-low active:bg-surface-variant text-secondary font-label-lg text-label-lg flex items-center justify-center gap-1 select-none active:scale-95 transition-transform" onclick="handleClear()" type="button">
<span class="material-symbols-outlined text-[20px]">
restart_alt
</span>
<span>
Clear
</span>
</button>
<!-- Digit 0 -->
<button class="h-14 min-h-[56px] rounded-xl bg-surface-container-lowest active:bg-secondary-container text-on-surface font-headline-md text-headline-md shadow-sm flex items-center justify-center select-none active:scale-95 transition-transform" onclick="handleKey('0')" type="button">

        0
      
</button>
<!-- Backspace Action -->
<button aria-label="Erase last digit" class="h-14 min-h-[56px] rounded-xl bg-surface-container-low active:bg-surface-variant text-secondary font-label-lg text-label-lg flex items-center justify-center select-none active:scale-95 transition-transform" onclick="handleBackspace()" type="button">
<span class="material-symbols-outlined text-[24px]">
backspace
</span>
</button>
</div>
</div>
<!-- Decision Actions -->
<div class="flex flex-col gap-space-sm mb-space-lg">
<button class="w-full h-14 min-h-[56px] rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-md active:opacity-90 transition-all select-none" id="submit-btn" onclick="submitPin()" type="button">
<span class="material-symbols-outlined text-[24px]">
task_alt
</span>
<span id="btn-label">
Confirm Completed Task
</span>
</button>
<button class="w-full h-14 min-h-[56px] rounded-xl bg-surface-container-lowest text-secondary font-label-lg text-label-lg flex items-center justify-center gap-space-xs active:bg-surface-container transition-colors select-none" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[20px]">
arrow_back
</span>
<span>
Cancel 
&amp;
 Return to Task Details
</span>
</button>
</div>
<!-- Helpful Guidance & Offline Indicator Note -->
</div>
<script>

  let enteredPin = []; // Empty by default; design prototype, no server validation

  function updateDisplay() {
    for (let i = 0; i < 4; i++) {
      const slot = document.getElementById(`slot-${i}`);
      if (!slot) continue;

      if (i < enteredPin.length) {
        // Filled digit dot
        slot.className = "w-14 h-16 rounded-xl bg-surface-container flex items-center justify-center transition-all duration-150";
        slot.innerHTML = '<div class="w-5 h-5 rounded-full bg-primary-container transform scale-100 transition-transform"></div>';
      } else if (i === enteredPin.length) {
        // Active cursor slot
        slot.className = "w-14 h-16 rounded-xl bg-surface-container-high flex items-center justify-center transition-all duration-150";
        slot.innerHTML = '<div class="w-1 h-7 rounded-full bg-primary animate-pulse" id="cursor-indicator"></div>';
      } else {
        // Unfilled inactive slot
        slot.className = "w-14 h-16 rounded-xl bg-surface-container-lowest flex items-center justify-center transition-all duration-150";
        slot.innerHTML = '<div class="w-3 h-3 rounded-full bg-surface-dim"></div>';
      }
    }

    const statusText = document.getElementById('pin-status-text');
    const submitBtn = document.getElementById('submit-btn');

    if (enteredPin.length === 4) {
      statusText.innerHTML = '<span class="material-symbols-outlined text-[18px] text-tertiary">check_circle</span><span class="text-tertiary">PIN ready for confirmation</span>';
      submitBtn.classList.remove('opacity-70');
    } else {
      statusText.innerHTML = `<span class="material-symbols-outlined text-[18px]">dialpad</span><span>Digit ${enteredPin.length + 1} of 4 required</span>`;
    }
  }

  function handleKey(num) {
    if (enteredPin.length < 4) {
      enteredPin.push(num);
      updateDisplay();
    }
  }

  function handleBackspace() {
    if (enteredPin.length > 0) {
      enteredPin.pop();
      updateDisplay();
    }
  }

  function handleClear() {
    enteredPin = [];
    updateDisplay();
  }

  function submitPin() {
    if (enteredPin.length !== 4) {
      const text = document.getElementById('pin-status-text');
      text.textContent = 'Enter all four digits to continue';
      return;
    }
    // DESIGN PREVIEW ONLY. Actual PIN verification must be server-side in Flutter/Supabase.
    enteredPin = [];
    window.location.href = '../janitra_task_submission_status_simplified/code.html';
  }

  // Initial draw
  updateDisplay();

</script>
</main>
</body>
</html>
