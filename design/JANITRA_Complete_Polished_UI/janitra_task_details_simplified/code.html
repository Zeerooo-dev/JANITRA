<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="mobile_stack" name="shell-type"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}
</style>
<link rel="stylesheet" href="../assets/tailwind-offline.css">
<style>

    body {
      min-height: max(884px, 100dvh);
    }
  
</style>
<link href="../assets/janitra-polish.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen" data-janitra-screen="janitra_task_details_simplified" style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #F5F6F8; color: #202C39;">
<header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]" style="background-color: #FFFFFF;">
<div class="h-16 px-4 flex items-center justify-between border-b border-[#E2E8F0] bg-white">
<div class="flex items-center gap-3">
<button aria-label="Go back" class="w-10 h-10 -ml-1 rounded-full flex items-center justify-center text-[#202C39] hover:bg-[#F1F5F9] active:bg-[#E2E8F0] transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-[24px]">
arrow_back
</span>
</button>
<h1 class="text-[20px] font-bold text-[#202C39] m-0">
Task Details
</h1>
</div>
</div>
</header>
<main class="flex flex-col relative w-full pt-16 pb-safe px-margin bg-surface flex-1">
<div class="flex flex-col w-full pb-8">
<div class="flex flex-col gap-6 pt-5 pb-6">
<div class="bg-white rounded-2xl p-6 shadow-sm border border-[#E8ECF1] flex flex-col gap-5">
<h2 class="text-[22px] font-bold text-[#202C39] leading-tight m-0">
Cleaning Tables
</h2>
<div class="h-[1px] bg-[#E8ECF1] w-full">
</div>
<div class="flex flex-col gap-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#EBF2F7] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[22px] text-[#234E70]">
schedule
</span>
</div>
<div>
<p class="text-[13px] text-[#526070] font-medium m-0 uppercase tracking-wide">
Scheduled Time
</p>
<p class="text-[18px] text-[#202C39] font-semibold m-0 mt-0.5">
10:00 AM
</p>
</div>
</div>
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#EBF2F7] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[22px] text-[#234E70]">
location_on
</span>
</div>
<div>
<p class="text-[13px] text-[#526070] font-medium m-0 uppercase tracking-wide">
Location
</p>
<p class="text-[18px] text-[#202C39] font-semibold m-0 mt-0.5">
Public Area
</p>
</div>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-[16px] font-bold text-[#202C39] m-0" for="remarksInput">
Remarks (Optional)
</label>
<textarea class="w-full p-4 rounded-xl bg-white border border-[#CBD5E1] text-[#202C39] text-[16px] placeholder:text-[#94A3B8] focus:border-[#234E70] focus:ring-1 focus:ring-[#234E70] focus:outline-none resize-none min-h-[52px]" id="remarksInput" placeholder="Add a note if needed..." rows="3">
</textarea>
</div>
<div class="mt-2">
<button class="w-full min-h-[56px] py-4 px-6 rounded-xl bg-[#234E70] text-white font-semibold text-[17px] flex items-center justify-center gap-2 hover:bg-[#1a3a54] active:scale-[0.99] transition-all cursor-pointer shadow-sm" id="submitButton" onclick="window.location.href='../janitra_confirm_completed_work_simplified/code.html'" type="button">
<span>
Mark as Done
</span>
</button>
</div>
</div>
</div>
</main>
</body>
</html>
