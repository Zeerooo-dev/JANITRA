<!DOCTYPE html>
<html lang="en" style="width: 390px; height: 646px; overflow: hidden; position: relative;">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="mobile_blank" name="shell-type"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="../assets/tailwind-offline.css" rel="stylesheet"/>
<style>

    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #F5F6F8;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 16px); }
    }
  
</style>
<link href="../assets/janitra-polish.css" rel="stylesheet"/>
</head>
<body class="bg-[#F5F6F8] font-['Inter',sans-serif] text-[#202C39] min-h-screen flex flex-col justify-center pt-safe pb-safe antialiased" data-janitra-screen="janitra_login_simplified">
<main class="w-full max-w-md mx-auto px-5 py-6 flex flex-col">
<!-- Top Branding Block: Centered Logo & Brand Name -->
<div class="flex flex-col items-center text-center mb-8">
<!-- JANITRA Icon Container -->
<div class="w-20 h-20 rounded-2xl bg-[#234E70] flex items-center justify-center shadow-sm mb-4">
<!-- High-contrast vector glyph -->
<svg class="w-12 h-12 text-[#4ade80]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7">
</path>
</svg>
</div>
<h1 class="text-[26px] leading-[34px] font-bold text-[#202C39] tracking-tight">

        Welcome to JANITRA
      
</h1>
<p class="text-[16px] leading-[24px] text-[#526070] mt-1.5 font-normal">

        Sign in to continue
      
</p>
</div>
<!-- Main Authentication Form Card -->
<div class="bg-[#FFFFFF] border border-[#E3E7EB] rounded-2xl p-6 sm:p-7 shadow-sm">
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Field 1: Email or Employee ID -->
<div class="flex flex-col gap-2">
<label class="text-[16px] font-semibold text-[#202C39]" for="workIdentifier">
Email Address
</label>
<div class="relative flex items-center">
<input autocomplete="username" class="w-full h-14 min-h-[56px] px-4 bg-[#FFFFFF] border-2 border-[#E3E7EB] rounded-xl text-[16px] text-[#202C39] placeholder-[#526070]/60 focus:border-[#234E70] focus:ring-0 focus:outline-none transition-colors" id="workIdentifier" name="identifier" placeholder="you@company.com" required="" type="email" value="c.torres@abcmanpower.com"/>
</div>
</div>
<!-- Field 2: Password -->
<div class="flex flex-col gap-2">
<label class="text-[16px] font-semibold text-[#202C39]" for="authPassword">

            Password
          
</label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-14 min-h-[56px] pl-4 pr-14 bg-[#FFFFFF] border-2 border-[#E3E7EB] rounded-xl text-[16px] text-[#202C39] placeholder-[#526070]/60 focus:border-[#234E70] focus:ring-0 focus:outline-none transition-colors" id="authPassword" name="password" placeholder="Enter your password" required="" type="password" value="IndustrialClean#2025"/>
<!-- Large Accessibility Touch Target Toggle (56x56) -->
<button aria-label="Show or hide password" class="absolute right-0 top-0 bottom-0 w-14 h-14 flex items-center justify-center text-[#526070] hover:text-[#202C39] focus:outline-none" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[26px]" id="pwdEyeIcon">
visibility_off
</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-14 min-h-[56px] bg-[#234E70] hover:bg-[#1a3c57] active:bg-[#122a3e] text-white text-[18px] font-bold rounded-xl flex items-center justify-center transition-colors focus:outline-none shadow-sm mt-2" id="signInSubmitBtn" type="submit">

          Sign In
        
</button>
<!-- Forgot Password Link -->
<div class="text-center pt-1">
<button class="text-[16px] font-semibold text-[#234E70] underline hover:text-[#1a3c57] py-2 focus:outline-none" onclick="showCredentialNotice()" type="button">

            Forgot Password?
          
</button>
</div>
</form>
</div>
</main>
<script>

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('authPassword');
      const eyeIcon = document.getElementById('pwdEyeIcon');
      if (!pwdInput || !eyeIcon) return;

      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.textContent = 'visibility';
      } else {
        pwdInput.type = 'password';
        eyeIcon.textContent = 'visibility_off';
      }
    }

    function showCredentialNotice() {
      alert('Please contact your shift supervisor or manpower coordinator to reset your password.');
    }
  
</script>
<div aria-hidden="true" data-snapdom-sandbox="true" id="snapdom-sandbox" style="position: absolute; left: -9999px; top: -9999px; width: 0px; height: 0px; overflow: hidden;">
</div>
</body>
</html>
