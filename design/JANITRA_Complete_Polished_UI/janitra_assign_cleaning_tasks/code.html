<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#234E70">
<title>
JANITRA · Assign Cleaning Task
</title>
<link rel="stylesheet" href="../assets/janitra-remaining.css">
</head>
<body>
<div class="screen">
<header class="head">
<a class="back" aria-label="Back" href="../janitra_work_schedule_overview/code.html">
←
</a>
<div class="headcopy">
<h1>
Assign Cleaning Task
</h1>
</div>
<div class="avatar" aria-label="Supervisor profile">
SV
</div>
</header>
<main class="">
<p class="site">
Juan Dela Cruz · SSS Valencia
</p>
<form onsubmit="event.preventDefault();if(![...document.querySelectorAll('.day[aria-pressed=true]')].length){JANITRA.toast('Choose at least one day.');return};JANITRA.preview('Cleaning-task assignment')">
<div class="field-wrap">
<label class="label" for="activity">
Cleaning Activity
</label>
<select id="activity" class="field" onchange="JANITRA.activityChange(this)">
<option>
Cleaning Restrooms
</option>
<option>
Cleaning Pantry
</option>
<option>
Cleaning Tables
</option>
<option>
Cleaning Ceiling
</option>
<option>
Cleaning Floors
</option>
<option value="custom">
+ Custom Activity
</option>
</select>
</div>
<div class="field-wrap hide" id="custom-activity">
<label class="label" for="custom-activity-name">
Custom Activity Name
</label>
<input id="custom-activity-name" class="field" placeholder="Enter cleaning activity">
</div>
<section class="section">
<h2>
Scheduled Days
</h2>
<div class="days" role="group" aria-label="Working days">
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Mon
</button>
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Tue
</button>
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Wed
</button>
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Thu
</button>
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Fri
</button>
<button type="button" class="day" aria-pressed="true" onclick="JANITRA.toggleDay(this)">
Sat
</button>
<button type="button" class="day" aria-pressed="false" onclick="JANITRA.toggleDay(this)">
Sun
</button>
</div>
</section>
<section class="section">
<h2>
Task Time
</h2>
<div class="time-pair">
<label>
<span class="label">
Start Time
</span>
<input class="field" type="time" value="08:00" required>
</label>
<label>
<span class="label">
End Time
</span>
<input class="field" type="time" value="09:00" required>
</label>
</div>
</section>
<button class="action" type="submit">
Save Cleaning Task
</button>
<a href="../janitra_work_schedule_overview/code.html" class="action quiet">
Back to Work Schedule
</a>
</form>
</main>
</div>
<div class="dialog" id="notice-dialog" role="dialog" aria-modal="true">
<div class="dialog-box">
<h2>
JANITRA Preview
</h2>
<p data-msg>
</p>
<button class="action" onclick="JANITRA.close()">
OK
</button>
</div>
</div>
<div class="dialog" id="confirm-dialog" role="dialog" aria-modal="true">
<div class="dialog-box">
<h2 data-title>
Confirm
</h2>
<p data-desc>
</p>
<div class="actions">
<button class="action" data-confirm>
Confirm
</button>
<button class="action secondary" onclick="JANITRA.close()">
Cancel
</button>
</div>
</div>
</div>
<script src="../assets/janitra-remaining.js">
</script>
</body>
</html>
